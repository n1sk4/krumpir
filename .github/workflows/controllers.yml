name: controllers

on:
  workflow_dispatch:

jobs:
  list: # every folder under controllers/ with a controller.toml
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.ls.outputs.dirs }}
    steps:
      - uses: actions/checkout@v4
      - id: ls
        run: echo "dirs=$(ls controllers/*/controller.toml | cut -d/ -f2 | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"

  build-test:
    needs: list
    name: ${{ matrix.controller }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        controller: ${{ fromJSON(needs.list.outputs.dirs) }}
    defaults:
      run:
        working-directory: controllers/${{ matrix.controller }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # libs/vendor/XCPlite for the XCP build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install tools
        run: pip install platformio -r ../../tools/requirements.txt

      - name: Generated files are up to date
        run: |
          python ../../tools/codegen/test_gen_controller.py
          python ../../tools/codegen/gen_controller.py . --check

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('controllers/*/platformio.ini') }}

      - name: Library tests (native)
        working-directory: libs
        run: pio test -e native

      - name: Unit tests (native)
        run: pio test -e native

      - name: Library and unit tests (CMake, without PlatformIO)
        run: |
          for p in ../../libs test; do
            b="${{ runner.temp }}/ctest/$(basename "$(realpath "$p")")"
            cmake -S "$p" -B "$b"
            cmake --build "$b"
            ctest --test-dir "$b" --output-on-failure
          done

      - name: Build firmware
        run: pio run -e esp32dev

      - name: Build firmware with XCP
        run: |
          cp ../../libs/esp/xcpglue/include/wlan.h.example ../../libs/esp/xcpglue/include/wlan.h
          pio run -e esp32dev-xcp

      - name: The controller's own steps (tools/ci.sh, from controller.toml)
        run: bash tools/ci.sh

      - name: Collect firmware
        run: |
          mkdir -p out
          cp .pio/build/esp32dev/firmware.bin .pio/build/esp32dev/firmware.elf out/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.controller }}
          path: controllers/${{ matrix.controller }}/out/
