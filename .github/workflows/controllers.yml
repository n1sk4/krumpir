name: controllers

on:
  workflow_dispatch:

jobs:
  tests: # the libraries' and controllers' Unity tests, codegen up to date, the tools' self-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - run: pip install ninja
      - run: python tools/kb.py setup
      - run: python tools/kb.py check
      - run: python tools/kb.py build --only "libs;controllers"
      - run: python tools/kb.py test

  list: # every folder under controllers/ with a controller.toml
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.ls.outputs.dirs }}
    steps:
      - uses: actions/checkout@v4
      - id: ls
        run: echo "dirs=$(ls controllers/*/controller.toml | cut -d/ -f2 | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"

  firmware:
    needs: list
    name: firmware (${{ matrix.controller }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        controller: ${{ fromJSON(needs.list.outputs.dirs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # libs/vendor/XCPlite for the XCP build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install tools (tools/ci.sh's plots and self-checks use this Python)
        run: pip install platformio -r tools/requirements.txt

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('controllers/*/platformio.ini') }}

      - run: python tools/kb.py fw ${{ matrix.controller }}

      - name: kb.py fw xcp
        run: |
          cp libs/esp/xcpglue/include/wlan.h.example libs/esp/xcpglue/include/wlan.h
          python tools/kb.py fw ${{ matrix.controller }} xcp

      - name: The controller's own steps (tools/ci.sh, from controller.toml)
        run: bash controllers/${{ matrix.controller }}/tools/ci.sh

      - name: Collect firmware
        working-directory: controllers/${{ matrix.controller }}
        run: |
          mkdir -p out
          cp .pio/build/esp32dev/firmware.bin .pio/build/esp32dev/firmware.elf out/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.controller }}
          path: controllers/${{ matrix.controller }}/out/
