name: esp32-motor-controller

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: controllers/esp32-motor-controller

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # libs/vendor/XCPlite for the XCP build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: controllers/esp32-motor-controller/requirements.txt

      - name: Install tools
        run: pip install platformio -r requirements.txt

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('controllers/esp32-motor-controller/platformio.ini') }}

      - name: Library tests (native)
        working-directory: libs
        run: pio test -e native

      - name: Unit tests (native)
        run: pio test -e native

      - name: Library and unit tests (CMake, without PlatformIO)
        run: |
          for p in ../../libs test; do
            b="${{ runner.temp }}/ctest/$(basename "$(realpath "$p")")"
            cmake -S "$p" -B "$b"
            cmake --build "$b"
            ctest --test-dir "$b" --output-on-failure
          done

      - name: Build firmware
        run: pio run -e esp32dev

      - name: Build firmware with XCP
        run: |
          cp ../../libs/esp/xcpglue/include/wlan.h.example ../../libs/esp/xcpglue/include/wlan.h
          pio run -e esp32dev-xcp

      - name: Timing tool self-check
        run: |
          python ../../tools/serial/timing_check.py --selftest
          python ../../tools/serial/capture.py --selftest

      - name: Simulation CSVs and plots
        run: |
          mkdir -p .pio out
          lib="lib/motorctrl/src"
          core="../../libs/ctrlcore/src"
          plant="../../libs/plants/dcmotor/src"
          inc="-Ilib/motorctrl/include -I../../libs/ctrlcore/include -I../../libs/plants/dcmotor/include"
          src="$lib/motor_io_sim.c $lib/motor_ctrl.c $lib/motor_safety.c $lib/motor_loop.c $core/pid.c $plant/plant_sim.c"
          gcc $inc tools/step_response.c $src -lm -o .pio/step_response
          gcc $inc tools/scenarios.c $src $lib/motor_scenario.c $core/step_metrics.c -lm -o .pio/scenarios
          .pio/step_response > out/step_response.csv
          python tools/plot.py out/step_response.csv out/step_response.png
          for s in step load saturation inertia; do
            .pio/scenarios $s > out/scenario_$s.csv
            python tools/plot.py out/scenario_$s.csv out/scenario_$s.png
          done
          .pio/scenarios sweep > out/gain_sweep.md

      - name: Collect firmware
        run: cp .pio/build/esp32dev/firmware.bin .pio/build/esp32dev/firmware.elf out/

      - uses: actions/upload-artifact@v4
        with:
          name: esp32-motor-controller
          path: controllers/esp32-motor-controller/out/
