# Generated by tools/codegen/gen_controller.py from controllers/esp32-t12-controller/controller.toml. Do not edit; change the description and regenerate.
name: esp32-t12-controller

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: controllers/esp32-t12-controller

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # libs/vendor/XCPlite for the XCP build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: controllers/esp32-t12-controller/requirements.txt

      - name: Install tools
        run: pip install platformio -r requirements.txt -r ../../tools/codegen/requirements.txt

      - name: Generated files are up to date
        run: |
          python ../../tools/codegen/test_gen_controller.py
          python ../../tools/codegen/gen_controller.py . --check

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('controllers/esp32-t12-controller/platformio.ini') }}

      - name: Library tests (native)
        working-directory: libs
        run: pio test -e native

      - name: Unit tests (native)
        run: pio test -e native

      - name: Library and unit tests (CMake, without PlatformIO)
        run: |
          for p in ../../libs test; do
            b="${{ runner.temp }}/ctest/$(basename "$(realpath "$p")")"
            cmake -S "$p" -B "$b"
            cmake --build "$b"
            ctest --test-dir "$b" --output-on-failure
          done

      - name: Build firmware
        run: pio run -e esp32dev

      - name: Build firmware on the HIL link
        run: pio run -e esp32dev-hil

      - name: Build firmware with XCP
        run: |
          cp ../../libs/esp/xcpglue/include/wlan.h.example ../../libs/esp/xcpglue/include/wlan.h
          pio run -e esp32dev-xcp

      - name: Serial tools self-check
        run: |
          python ../../tools/serial/capture.py --selftest
          python ../../tools/serial/timing_check.py --selftest

      - name: Scenario CSVs, plots and tables
        run: |
          mkdir -p .pio out
          lib="lib/t12ctrl/src"
          core="../../libs/ctrlcore/src"
          plant="../../libs/plants/t12"
          gcc -Ilib/t12ctrl/include -I../../libs/ctrlcore/include -I$plant/include \
            tools/scenarios.c $lib/t12_scenario.c $lib/t12_loop.c $lib/t12_ctrl.c $lib/t12_cycle.c \
            $lib/t12_convert.c $lib/t12_safety.c $lib/t12_io_sim.c $lib/t12_frontend.c \
            $core/pid.c $core/step_metrics.c \
            $plant/src/t12_plant.c -lm -o .pio/scenarios
          for s in cold load ambient open short stuck runaway; do
            .pio/scenarios $s > out/scenario_$s.csv
            python tools/plot.py out/scenario_$s.csv out/scenario_$s.png
          done
          .pio/scenarios summary > out/scenarios.md
          .pio/scenarios sweep > out/gain_sweep.md

      - name: Collect firmware
        run: cp .pio/build/esp32dev/firmware.bin .pio/build/esp32dev/firmware.elf out/

      - uses: actions/upload-artifact@v4
        with:
          name: esp32-t12-controller
          path: controllers/esp32-t12-controller/out/
