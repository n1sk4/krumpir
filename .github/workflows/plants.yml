name: plants

on:
  workflow_dispatch:

jobs:
  fmus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # libs/vendor/Reference-FMUs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Setup (apt packages with the aarch64 cross compiler and qemu, the venv)
        run: python tools/kb.py setup --system

      - name: Build, test and merge the plant FMUs (x86_64-linux, aarch64-linux)
        run: python tools/kb.py fmus --both-archs

      - uses: actions/upload-artifact@v4
        with:
          name: plant-fmus
          path: build/plant-fmus/fmus/
