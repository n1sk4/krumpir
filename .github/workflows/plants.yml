name: plants

on:
  workflow_dispatch:

jobs:
  fmus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # libs/vendor/Reference-FMUs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-aarch64-linux-gnu qemu-user
          pip install -r tools/requirements.txt

      - name: Build, test and merge the plant FMUs (x86_64-linux, aarch64-linux)
        run: KRUMPIR_PYTHON=$(which python) bash libs/plants/tools/build_fmus.sh build/plant-fmus

      - uses: actions/upload-artifact@v4
        with:
          name: plant-fmus
          path: build/plant-fmus/fmus/
