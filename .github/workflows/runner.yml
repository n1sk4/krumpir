name: runner

on:
  workflow_dispatch:

jobs:
  build-test:
    name: build-test (${{ matrix.preset }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        preset: [dev, asan]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # libs/vendor/Reference-FMUs for the plant FMUs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Setup (apt packages, the venv, the Reference FMUs)
        run: python tools/kb.py setup --system

      - run: python tools/kb.py build --preset ${{ matrix.preset }} --only runner
      - run: python tools/kb.py test --preset ${{ matrix.preset }}

      - name: FMPy overlay plots
        if: matrix.preset == 'dev'
        working-directory: runner
        run: |
          mkdir -p out
          for s in feedthrough dahlquist vanderpol dcmotor t12tip; do
            ~/.venvs/krumpir/bin/python tools/compare_fmpy.py scenarios/$s.toml \
              --run ../build/dev/runner/krumpir --plot out/$s.png
          done

      - uses: actions/upload-artifact@v4
        if: matrix.preset == 'dev'
        with:
          name: runner-fmpy-plots
          path: runner/out/
