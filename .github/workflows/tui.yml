name: tui

on:
  workflow_dispatch:

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, preset: release }
          - { os: ubuntu-24.04-arm, preset: release }
          - { os: windows-latest, preset: mingw }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install ninja

      - name: MinGW-w64 gcc (the mingw preset)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc

      - if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"

      - run: python tools/kb.py build --preset ${{ matrix.preset }} --only tui
      - run: python tools/kb.py test --preset ${{ matrix.preset }}

      - uses: actions/upload-artifact@v4
        with:
          name: krumpir-tui-${{ matrix.os }}
          path: |
            build/${{ matrix.preset }}/clients/tui/krumpir-tui
            build/${{ matrix.preset }}/clients/tui/krumpir-tui.exe
          if-no-files-found: error
