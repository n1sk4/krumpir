[env]
lib_extra_dirs = ../../libs, ../../libs/plants, ../../libs/esp
lib_deps = ctrlcore, dcmotor
lib_ignore = vendor  ; submodules in libs/vendor, built through their wrappers

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = espidf
monitor_speed = 115200
lib_deps =
  ${env.lib_deps}
  espglue

[env:native]
platform = native
test_framework = unity
build_flags = -Ilib/control/include -lm
