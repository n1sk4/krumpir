; Shared PlatformIO settings for the XCP build of an ESP-IDF controller, see controllers/README.md (XCP).
; Paths are relative to the controller folder (controllers/<name>).
[xcp]
extra_scripts =
  pre:../../libs/esp/xcpglue/xcp_epk.py
  post:../../libs/esp/xcplite/xcp_sections.py
cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;../../libs/esp/xcpglue/sdkconfig.xcp.defaults"
build_flags =
  -DKRUMPIR_XCP
  -DOPTION_FREERTOS_CORE=0
  -D_FREE_RTOS
  -DXCPLITE_CONFIGURATION=rtos
  '-DXCPLIB_CFG_OVERRIDE="xcplib_rtos_cfg.h"'
  -I$PROJECT_PACKAGES_DIR/framework-espidf/components/freertos/FreeRTOS-Kernel/include/freertos
