# DC motor plant against the motor controller's own code on this PC (tools/hil/pc_loop.sh
# motor-stall): at 3000 rpm the encoder dies at t = 0.5 s (fault 2: speed_rpm reads 0 while the
# shaft turns on). The controller drives to full duty, sees no rotation and must trip
# (no rotation) and put the duty to 0.
[model]
fmu = "fmus/dcmotor.fmu"
step = 0.001
duration = 1
params = { Vbus = 6.0 }

[rt]
wait = "none"

[io]
backend = "uart"
device = "/tmp/krumpir-hil/runner"
timeout_ms = 500
inputs = ["duty", "fault"]
outputs = ["speed_rpm", "current"]
stimulus = [
  { input = "fault", kind = "step", t = 0.5, from = 0, to = 2 },
]

[log]
file = "runs/dcmotor_stall_hil_pc.csv"
