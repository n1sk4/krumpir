# Input to output wiring: the output follows the input, which steps from 0 to 2.5 at t = 0.5 s.
[model]
fmu = "fmus/Feedthrough.fmu"
step = 0.001
duration = 2

[rt]
wait = "none"

[io]
backend = "null"
inputs = ["Float64_continuous_input"]
outputs = ["Float64_continuous_output"]
stimulus = [{ input = "Float64_continuous_input", kind = "step", t = 0.5, from = 0, to = 2.5 }]

[log]
file = "runs/feedthrough.csv"
