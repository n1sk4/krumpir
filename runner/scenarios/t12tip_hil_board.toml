# T12 tip plant against the T12 controller on the ESP32 (env esp32dev-hil), over its UART2 and a
# USB-serial adapter (controllers/esp32-t12-controller/docs/krumpir-interface.md, "HIL link").
# The board ticks on its own 1 kHz timer: the runner is paced and takes its newest answer without
# waiting; a step without a new one holds the last commands and counts as late. Start the
# controller on its console first (sp 350, start); a joint (0.1 W/K) is touched at t = 10 s.
[model]
fmu = "fmus/t12tip.fmu"
step = 0.001
duration = 14

[rt]
wait = "sleep"
max_overruns = 10000

[io]
backend = "uart"
device = "/dev/ttyUSB0"
baud = 921600
timeout_ms = 0
late = "hold"
inputs = ["heater", "series_on", "load_wk"]
outputs = ["v_amp", "i_heater", "t_handle_c", "t_tip_c"]
stimulus = [
  { input = "load_wk", kind = "step", t = 10.0, from = 0, to = 0.1 },
]

[log]
file = "runs/t12tip_hil_board.csv"
