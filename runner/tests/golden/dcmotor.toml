# Golden scenario: short, deterministic (unpaced) run compared against dcmotor.csv.
# Paths are relative to the runner/ directory. fmus/dcmotor.fmu is built with the runner.
[model]
fmu = "fmus/dcmotor.fmu"
step = 0.001
duration = 1

[rt]
wait = "none"

[io]
backend = "null"
inputs = ["duty", "load_torque"]
outputs = ["speed_rpm", "current"]
stimulus = [
  { input = "duty", kind = "step", t = 0.1, from = 0, to = 0.5 },
  { input = "load_torque", kind = "step", t = 0.5, from = 0, to = 0.0002 },
]

[log]
file = "runs/golden_dcmotor.csv"
