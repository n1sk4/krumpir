[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "krumpir"
version = "0.1.0"
description = "Client of the Krumpir model-access service (ASAM XIL style)"
requires-python = ">=3.13"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["krumpir"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
